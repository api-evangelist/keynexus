name: Keynexus
description: >-
  KeyNexus was an enterprise encryption key management company based in Victoria,
  British Columbia, Canada, providing centralized key management, Bring Your Own
  Key (BYOK), and Key Management as a Service for cloud, on-premises, and hybrid
  deployments. Its platform helped enterprises generate, store, distribute, and
  control the lifecycle of encryption keys used to protect data across
  applications and infrastructure. KeyNexus was acquired by StorMagic in January
  2021, and its technology was folded into the StorMagic SvKMS (Secure Virtual
  Key Management Service) product; the keynexus.com domain now redirects to
  StorMagic's encryption key management offering. This profile was surfaced as a
  portfolio company of Uncork Capital and added to the API Evangelist network for
  tracking. KeyNexus no longer operates as an independent developer platform.
